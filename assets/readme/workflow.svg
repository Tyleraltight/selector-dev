<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">
  <title id="title">selector-dev workflow — Browser tweak to same-origin queue to agent source edit</title>
  <desc id="desc">Three-step workflow diagram: dormant Alt+S browser overlay, same-origin dev middleware with loopback security, and agent queue consumption via 改ui.</desc>

  <rect width="1200" height="340" rx="20" fill="#0d1117"/>

  <g id="step-1" transform="translate(48 40)">
    <rect width="340" height="260" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="340" height="5" rx="2.5" fill="#3fb950"/>
    <text x="24" y="42" fill="#3fb950"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" font-weight="700">01 · BROWSER</text>
    <text x="24" y="84" fill="#f0f6fc"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="26" font-weight="700">Wake &amp; Tweak Live</text>
    <text x="24" y="126" fill="#c9d1d9"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20">Dormant pill stays quiet.</text>
    <text x="24" y="158" fill="#c9d1d9"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20">Press Alt+S to pick &amp; tune</text>
    <text x="24" y="190" fill="#c9d1d9"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20">spacing, type, radius, color.</text>
    <text x="24" y="234" fill="#8b949e"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18">Reverts preview on Send</text>
  </g>

  <path d="M 398 170 L 420 170 M 412 162 L 422 170 L 412 178"
        fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="step-2" transform="translate(430 40)">
    <rect width="340" height="260" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="340" height="5" rx="2.5" fill="#58a6ff"/>
    <text x="24" y="42" fill="#58a6ff"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" font-weight="700">02 · DEV BRIDGE</text>
    <text x="24" y="84" fill="#f0f6fc"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="26" font-weight="700">Same-Origin Queue</text>
    <text x="24" y="126" fill="#c9d1d9"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20">Zero-dep Vite &amp; Next.js</text>
    <text x="24" y="158" fill="#c9d1d9"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20">middleware writes batches to</text>
    <text x="24" y="190" fill="#58a6ff"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="20">.tmp/selector-queue.md</text>
    <text x="24" y="234" fill="#8b949e"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18">Loopback + 1 MB guard</text>
  </g>

  <path d="M 780 170 L 802 170 M 794 162 L 804 170 L 794 178"
        fill="none" stroke="#d29922" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="step-3" transform="translate(812 40)">
    <rect width="340" height="260" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="340" height="5" rx="2.5" fill="#d29922"/>
    <text x="24" y="42" fill="#d29922"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" font-weight="700">03 · AGENT LOOP</text>
    <text x="24" y="84" fill="#f0f6fc"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="26" font-weight="700">Apply Real Code</text>
    <text x="24" y="126" fill="#c9d1d9"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20">Send 改ui or check ui.</text>
    <text x="24" y="158" fill="#c9d1d9"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20">Agent reads styleDiff +</text>
    <text x="24" y="190" fill="#c9d1d9"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20">source, edits CSS/TSX, clears.</text>
    <text x="24" y="234" fill="#8b949e"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18">HMR updates cleanly</text>
  </g>
</svg>
