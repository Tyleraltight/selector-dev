<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">selector-dev — Alt+S visual element picker, live CSS tweaker, and workspace feedback queue</title>
  <desc id="desc">Dark developer workbench banner showing selector-dev title, Alt+S dormant toggle, and a real styleDiff batch output card.</desc>

  <defs>
    <clipPath id="canvas-clip">
      <rect width="1200" height="380" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <rect width="1200" height="380" fill="#0d1117"/>
    <rect x="0" y="0" width="1200" height="6" fill="#3fb950"/>
  </g>

  <g id="title-block" transform="translate(56 0)">
    <text x="0" y="56"
          fill="#8b949e"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="18" font-weight="600" letter-spacing="1.5">VITE &amp; NEXT.JS DEV BRIDGE · AGENT SKILL</text>

    <rect x="0" y="96" width="28" height="28" rx="6" fill="none" stroke="#58a6ff" stroke-width="3"/>
    <circle cx="14" cy="110" r="5" fill="#3fb950"/>

    <text x="44" y="130"
          fill="#f0f6fc"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="60" font-weight="800" letter-spacing="-1.5">selector-dev</text>

    <text x="0" y="188"
          fill="#e6edf3"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="24" font-weight="600">Alt+S to wake. Tweak CSS live. Send styleDiff to your repo.</text>

    <text x="0" y="226"
          fill="#8b949e"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="20">Zero-clipboard feedback loop for Claude Code, Codex &amp; Antigravity.</text>

    <g transform="translate(0 278)">
      <rect x="0" y="0" width="102" height="42" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="51" y="27" text-anchor="middle" fill="#3fb950"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="19" font-weight="700">Alt+S</text>

      <rect x="116" y="0" width="152" height="42" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="192" y="27" text-anchor="middle" fill="#58a6ff"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="19" font-weight="600">styleDiff:</text>

      <rect x="282" y="0" width="298" height="42" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="431" y="27" text-anchor="middle" fill="#c9d1d9"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18">built on oil-oil/selector</text>
    </g>
  </g>

  <g id="specimen-card" transform="translate(704 42)">
    <rect width="440" height="296" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="440" height="48" rx="16" fill="#1c2128"/>
    <rect x="0" y="32" width="440" height="16" fill="#1c2128"/>
    <circle cx="24" cy="24" r="6" fill="#3fb950"/>
    <text x="42" y="30" fill="#e6edf3"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" font-weight="600">.tmp/selector-queue.md</text>

    <g transform="translate(24 82)">
      <text x="0" y="0" fill="#f0f6fc"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="19" font-weight="600">1. button#hero-btn</text>
      <text x="0" y="32" fill="#8b949e"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18">source: Hero.tsx:42</text>
      <text x="0" y="68" fill="#58a6ff"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" font-weight="600">styleDiff:</text>
      <text x="0" y="98" fill="#3fb950"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18">  padding-top: 8px -&gt; 24px</text>
      <text x="0" y="126" fill="#3fb950"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18">  font-size: 14px -&gt; 18px</text>
      <text x="0" y="160" fill="#e6edf3"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18">note: Match section scale</text>
    </g>

    <g transform="translate(24 246)">
      <rect x="0" y="0" width="232" height="34" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="14" y="23" fill="#8b949e"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18">POST /__selector</text>
      <rect x="248" y="0" width="144" height="34" rx="17" fill="#238636"/>
      <text x="320" y="23" text-anchor="middle" fill="#ffffff"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="18" font-weight="700">Sent (#1)</text>
    </g>
  </g>
</svg>
